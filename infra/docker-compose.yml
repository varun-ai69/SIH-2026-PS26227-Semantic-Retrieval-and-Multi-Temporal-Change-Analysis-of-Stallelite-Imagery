name: infra

services:

  # --- Postgres + PostGIS -----------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4
    container_name: eo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eo_password}
      POSTGRES_DB: ${POSTGRES_DB:-eo_archive}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eo_admin} -d ${POSTGRES_DB:-eo_archive}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Qdrant Vector Database -------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: eo_qdrant
    restart: unless-stopped
    expose:
      - "6333"   # REST API
      - "6334"   # gRPC API
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- MinIO (S3-Compatible Object Storage) -----------------------------
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: eo_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-eo_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-eo_password}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data

  # --- Canopus Backend API & Leaflet Web UI ---------------------------
  backend:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
    container_name: eo_backend
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/app/infra/docker/entrypoint.sh"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - DEVICE=${DEVICE:-auto}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-eo_archive}
      - POSTGRES_USER=${POSTGRES_USER:-eo_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-eo_password}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-eo_admin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-eo_password}
      - PORT=${PORT:-8000}
      - OFFLINE_MODE=${OFFLINE_MODE:-false}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ../data:/app/data
      - ../models:/app/models
      - ../frontend:/app/frontend
      - ../backend:/app/backend
      - ../scripts:/app/scripts

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
